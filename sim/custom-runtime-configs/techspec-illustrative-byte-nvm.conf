# Illustrative byte-addressable technology-spec card for ONE FASED bridge.
# These numbers are the Chisel register defaults. They are not a measured
# device, not a FeFET calibration, and not an energy or endurance rating.
# Index _0 only. A design with more memory bridges needs one copy per bridge.
# traceEnable prints nothing unless the model was elaborated with requestTrace.
+mm_relaxFunctionalModel_0=0
+mm_readMaxReqs_0=32
+mm_writeMaxReqs_0=32
+mm_writeLatency_0=30
+mm_readLatency_0=30
+mm_writeServiceCycles_0=1
+mm_readServiceCycles_0=1
+mm_enduranceLimitBytes_0=0
+mm_retentionCycles_0=0
+mm_traceEnable_0=0
